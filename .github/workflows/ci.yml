name: CI

# This repo is the ONE DOOR to Codex for every project on this machine, and it had no CI at all —
# every PR merged on local evidence alone. That is the gap this closes.
#
# It proves the suite passes, the types check, and the shipped CLI builds.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version this repo is developed against, so CI cannot pass on a
          # runtime the author never ran. Bump deliberately, never implicitly.
          bun-version: 1.3.14

      # --frozen-lockfile fails the run if bun.lock disagrees with package.json, so a
      # dependency added without committing the lockfile is caught here rather than
      # silently resolving differently on someone else's machine.
      - name: Install
        run: bun install --frozen-lockfile

      # Runs before the tests: a type error is a faster and more specific failure than
      # whatever the suite happens to throw downstream of it. Adding this found a real
      # signature bug (normalizeJobLifecycle claimed to return the caller's turnState while
      # overwriting it) and four dead duplicate keys in test fixtures.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # The CLI is what actually ships and what every other project invokes, so a build
      # failure is a broken door even when the tests are green.
      - name: Build the CLI
        run: bun run build

# FOLLOW-UP, deliberately not done here:
#   - No lint step. There is no linter configured yet, and adding one mid-migration would bury
#     real diffs under formatting churn. Worth doing once the transport rewrite has landed.
