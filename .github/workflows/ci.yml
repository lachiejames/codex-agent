name: CI

# This repo is the ONE DOOR to Codex for every project on this machine, and it had no CI at all —
# every PR merged on local evidence alone. That is the gap this closes.
#
# It runs `bun run validate` — the same gate `git push` runs locally, and the only list of
# checks this repo has. The bundle `build` produces is NOT what ships: `bin/codex-agent` execs
# `src/cli.ts` directly, so the build step is a bundleability check, not a release artifact.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version this repo is developed against, so CI cannot pass on a
          # runtime the author never ran. Bump deliberately, never implicitly.
          bun-version: 1.3.14

      # --frozen-lockfile fails the run if bun.lock disagrees with package.json, so a
      # dependency added without committing the lockfile is caught here rather than
      # silently resolving differently on someone else's machine.
      - name: Install
        run: bun install --frozen-lockfile

      # ONE step, deliberately. This used to be three steps — typecheck, test, build — which
      # meant CI enforced a WEAKER bar than the local pre-push hook: no lint, no format check,
      # no test-discipline scan, and no dead-code check. A lint regression merged on green CI,
      # and `knip` sat at exit 1 for as long as it had existed because nothing ran it.
      #
      # Reproducing the list here is what let the two drift apart, so CI no longer has its own
      # list. `bun run validate` IS the list (src/gate/core.ts), it does not short-circuit, and
      # one run reports every failure. Anything added to the gate is enforced here for free.
      - name: Gate
        run: bun run validate
